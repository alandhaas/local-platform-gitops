apiVersion: batch/v1
kind: Job
metadata:
  name: personal-platform-api-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      restartPolicy: Never
      containers:
        - name: migrate
          image: personal-platform-api
          imagePullPolicy: Always
          args: ["migrate"]
          envFrom:
            - secretRef:
                name: personal-platform-api-db
            - secretRef:
                name: auth-api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
