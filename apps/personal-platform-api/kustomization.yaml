apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps
resources:
  - migration-job.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - middleware.yaml
images:
  - name: personal-platform-api
    newName: ghcr.io/alandhaas/personal-platform-api
    newTag: main
    digest: sha256:<current-image-digest>
