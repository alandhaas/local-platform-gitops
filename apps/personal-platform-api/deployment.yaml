apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-platform-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: personal-platform-api
  template:
    metadata:
      labels:
        app: personal-platform-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          image: personal-platform-api
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: personal-platform-api-db
            - secretRef:
                name: auth-api-secrets
          env:
            - name: PORT
              value: "8000"
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
