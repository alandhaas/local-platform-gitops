apiVersion: apps/v1
kind: Deployment
metadata:
  name: fragrance-rank-api
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fragrance-rank-api
  template:
    metadata:
      labels:
        app: fragrance-rank-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          image: fragrance-rank-api
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: fragrance-rank-api-db
            - secretRef:
                name: auth-api-secrets
            - configMapRef:
                name: client-url
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
