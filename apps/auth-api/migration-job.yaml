apiVersion: batch/v1
kind: Job
metadata:
  name: auth-api-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      restartPolicy: Never
      containers:
        - name: migrate
          image: auth-api
          imagePullPolicy: Always
          command: ["python"]
          args: ["-m", "app.migrate"] #different then other apps because we want to run the migration script directly
          envFrom:
            - secretRef:
                name: auth-api-db
            - secretRef:
                name: auth-api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
