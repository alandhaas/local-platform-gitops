apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: auth-public-sensitive-limit
spec:
  rateLimit:
    average: 10
    period: 1m
    burst: 5
    sourceCriterion:
      requestHeaderName: CF-Connecting-IP
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: auth-public-general-limit
spec:
  rateLimit:
    average: 60
    period: 1m
    burst: 20
    sourceCriterion:
      requestHeaderName: CF-Connecting-IP