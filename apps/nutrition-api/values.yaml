fullnameOverride: nutrition-api

replicaCount: 1

image:
  repository: ghcr.io/alandhaas/nutrition-api
  tag: main@sha256:77a77b88fbdb46095877edc7eafb8f8d355d7570301aea01e9b9a4a0446c1f07
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull

envFrom:
  secretRefs:
    - nutrition-api-secrets
    - auth-api-secrets
  configMapRefs:
    - client-url

service:
  port: 8000

probes:
  path: /health
  periodSeconds: 30
  startupFailureThreshold: 30

ingress:
  className: traefik
  path: /nutrition
  pathType: Prefix
  internal:
    enabled: true
    host: local.platform.localhost
  public:
    enabled: true
    host: gym-tracker.tech
    entryPoints: web

rateLimit:
  enabled: true
  average: 20
  period: 1s
  burst: 40
  sourceHeader: CF-Connecting-IP

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
