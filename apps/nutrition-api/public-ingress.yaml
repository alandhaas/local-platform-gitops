apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nutrition-api-public
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: >-
      apps-nutrition-api-public-rate-limit@kubernetescrd,
      apps-nutrition-api-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: gym-tracker.tech
      http:
        paths:
          - path: /nutrition
            pathType: Prefix
            backend:
              service:
                name: nutrition-api
                port:
                  number: 8000
