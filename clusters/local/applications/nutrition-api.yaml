apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nutrition-api
  namespace: argocd
  labels:
    platform.example.com/image-updates: enabled
spec:
  project: default
  sources:
    - repoURL: https://github.com/alandhaas/local-platform-gitops.git
      targetRevision: main
      path: charts/platform-api
      helm:
        releaseName: nutrition-api
        valueFiles:
          - $values/apps/nutrition-api/values.yaml
    - repoURL: https://github.com/alandhaas/local-platform-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
