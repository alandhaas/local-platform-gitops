apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k3s-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alandhaas/local-platform-gitops.git
    targetRevision: main
    path: clusters/k3s-local
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
