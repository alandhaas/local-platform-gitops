apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - https://github.com/argoproj-labs/argocd-image-updater/config/default?ref=v1.3.1
  - apps/auth-api.yaml
  - apps/personal-platform-api.yaml
  - apps/nutrition-api.yaml
  - apps/fragrance-rank-api.yaml
patches:
  - target:
      kind: ConfigMap
      name: argocd-image-updater-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-image-updater-config
      data:
        argocd.namespace: argocd
        watch.namespaces: argocd
        interval: 2m
        git.user: platform-image-updater
        git.email: platform-image-updater@users.noreply.github.com
