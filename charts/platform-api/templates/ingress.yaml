{{- if .Values.ingress.internal.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "platform-api.fullname" . }}
  labels:
    {{- include "platform-api.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s@kubernetescrd" .Release.Namespace (include "platform-api.stripPrefixMiddlewareName" .) }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.internal.host }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "platform-api.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
{{- if and .Values.ingress.internal.enabled .Values.ingress.public.enabled }}
---
{{- end }}
{{- if .Values.ingress.public.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "platform-api.fullname" . }}-public
  labels:
    {{- include "platform-api.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: {{ .Values.ingress.public.entryPoints }}
    traefik.ingress.kubernetes.io/router.middlewares: >-
      {{- if .Values.rateLimit.enabled }}
      {{ printf "%s-%s@kubernetescrd" .Release.Namespace (include "platform-api.rateLimitMiddlewareName" .) }},
      {{- end }}
      {{ printf "%s-%s@kubernetescrd" .Release.Namespace (include "platform-api.stripPrefixMiddlewareName" .) }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.public.host }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "platform-api.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
